
name: Deploy Frontend Livraria - Azure

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/main_exe8-front.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar arquivos do frontend
        run: |
          test -f frontend/package.json
          test -f frontend/server.js
          node --check frontend/server.js
          node --check frontend/script.js

      - name: Login na Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7D640D3BEEEC4980B9AAFB8DF88035F8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9412E03B3FE94258BF542310BC419492 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A7D5E1DDAE3344E7A6FA65E8237CD20F }}

      - name: Publicar frontend na Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Exe8-front'
          slot-name: 'Production'
          package: './frontend'
